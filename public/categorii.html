<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BugetulMeu - Categorii</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- MENIU -->
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">BugetulMeu</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#meniu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="meniu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Acasă</a></li>
          <li class="nav-item"><a class="nav-link" href="tranzactii.html">Tranzacții</a></li>
          <li class="nav-item"><a class="nav-link active" href="categorii.html">Categorii</a></li>
        </ul>
        <a class="btn btn-accent" href="login.html">Autentificare</a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="mb-4">Categorii</h1>

    <div class="row g-3">
      <!-- Formular -->
      <div class="col-12 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3" id="titlu-formular">Adaugă categorie</h2>
            <form id="form-categorie" novalidate>
              <input type="hidden" id="categorie-id">
              <div class="mb-3">
                <label for="nume" class="form-label">Nume categorie</label>
                <input type="text" class="form-control" id="nume" placeholder="ex: Mâncare">
                <div class="invalid-feedback" id="eroare-nume"></div>
              </div>
              <button type="submit" class="btn btn-accent" id="buton-salveaza">Adaugă</button>
              <button type="button" class="btn btn-outline-secondary d-none" id="buton-anuleaza">Anulează</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Lista -->
      <div class="col-12 col-lg-8">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Categoriile mele</h2>
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr><th>Nume</th><th class="text-end">Acțiuni</th></tr>
                </thead>
                <tbody id="lista-categorii"></tbody>
              </table>
            </div>
            <p class="text-muted d-none" id="mesaj-gol">Nu ai nicio categorie încă. Adaugă prima!</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer text-center py-3 mt-4">
    <p class="mb-0">&copy; 2026 BugetulMeu. Proiect pentru Programare Multimedia.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/categorii.js"></script>
</body>
</html>
