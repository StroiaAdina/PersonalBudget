<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BugetulMeu - Autentificare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">BugetulMeu</a>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="mb-4">Autentificare</h1>

    <div class="row g-3">
      <!-- Login -->
      <div class="col-12 col-md-6">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Am deja cont</h2>
            <form id="form-login" novalidate>
              <div class="mb-3">
                <label for="login-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="login-email">
                <div class="invalid-feedback" id="eroare-login-email"></div>
              </div>
              <div class="mb-3">
                <label for="login-parola" class="form-label">Parolă</label>
                <input type="password" class="form-control" id="login-parola">
                <div class="invalid-feedback" id="eroare-login-parola"></div>
              </div>
              <p class="text-danger d-none" id="mesaj-login"></p>
              <button type="submit" class="btn btn-accent">Intră în cont</button>
            </form>
            <p class="text-muted small mt-3 mb-0">Cont de test: maria@exemplu.ro / test1234</p>
          </div>
        </div>
      </div>

      <!-- Înregistrare -->
      <div class="col-12 col-md-6">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Cont nou</h2>
            <form id="form-inregistrare" novalidate>
              <div class="mb-3">
                <label for="reg-nume" class="form-label">Nume</label>
                <input type="text" class="form-control" id="reg-nume">
                <div class="invalid-feedback" id="eroare-reg-nume"></div>
              </div>
              <div class="mb-3">
                <label for="reg-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="reg-email">
                <div class="invalid-feedback" id="eroare-reg-email"></div>
              </div>
              <div class="mb-3">
                <label for="reg-parola" class="form-label">Parolă (minimum 8 caractere)</label>
                <input type="password" class="form-control" id="reg-parola">
                <div class="invalid-feedback" id="eroare-reg-parola"></div>
              </div>
              <div class="mb-3">
                <label for="reg-parola2" class="form-label">Repetă parola</label>
                <input type="password" class="form-control" id="reg-parola2">
                <div class="invalid-feedback" id="eroare-reg-parola2"></div>
              </div>
              <p class="text-danger d-none" id="mesaj-reg"></p>
              <button type="submit" class="btn btn-accent">Creează cont</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer text-center py-3 mt-4">
    <p class="mb-0">&copy; 2026 BugetulMeu. Proiect pentru Programare Multimedia.</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
