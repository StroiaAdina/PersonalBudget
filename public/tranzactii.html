<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BugetulMeu - Tranzacții</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- MENIU -->
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">BugetulMeu</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#meniu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="meniu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Acasă</a></li>
          <li class="nav-item"><a class="nav-link active" href="tranzactii.html">Tranzacții</a></li>
          <li class="nav-item"><a class="nav-link" href="categorii.html">Categorii</a></li>
        </ul>
        <a class="btn btn-accent" href="login.html">Autentificare</a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="mb-4">Tranzacții</h1>

    <div class="row g-3">
      <!-- Formular -->
      <div class="col-12 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3" id="titlu-formular">Adaugă tranzacție</h2>
            <form id="form-tranzactie" novalidate>
              <input type="hidden" id="tranzactie-id">

              <div class="mb-3">
                <label for="suma" class="form-label">Sumă (lei)</label>
                <input type="number" step="0.01" class="form-control" id="suma" placeholder="ex: 150">
                <div class="invalid-feedback" id="eroare-suma"></div>
              </div>

              <div class="mb-3">
                <label for="tip" class="form-label">Tip</label>
                <select class="form-select" id="tip">
                  <option value="cheltuiala">Cheltuială</option>
                  <option value="venit">Venit</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="data" class="form-label">Data</label>
                <input type="date" class="form-control" id="data">
                <div class="invalid-feedback" id="eroare-data"></div>
              </div>

              <div class="mb-3">
                <label for="categorie" class="form-label">Categorie</label>
                <select class="form-select" id="categorie"></select>
                <div class="invalid-feedback" id="eroare-categorie"></div>
              </div>

              <div class="mb-3">
                <label for="descriere" class="form-label">Descriere (opțional)</label>
                <input type="text" class="form-control" id="descriere" placeholder="ex: Cumpărături Kaufland">
              </div>

              <button type="submit" class="btn btn-accent" id="buton-salveaza">Adaugă</button>
              <button type="button" class="btn btn-outline-secondary d-none" id="buton-anuleaza">Anulează</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Lista -->
      <div class="col-12 col-lg-8">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Istoric tranzacții</h2>
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Data</th><th>Descriere</th><th>Categorie</th>
                    <th class="text-end">Sumă</th><th class="text-end">Acțiuni</th>
                  </tr>
                </thead>
                <tbody id="lista-tranzactii"></tbody>
              </table>
            </div>
            <p class="text-muted d-none" id="mesaj-gol">Nu ai nicio tranzacție încă.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer text-center py-3 mt-4">
    <p class="mb-0">&copy; 2026 BugetulMeu. Proiect pentru Programare Multimedia.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/tranzactii.js"></script>
</body>
</html>
